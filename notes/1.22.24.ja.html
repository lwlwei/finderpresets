<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>修正</h3>
<ul>
<li><strong>アップデートウィンドウのボタン（アップデートをインストール、このバージョンはスキップなど）と、「開く」「保存」パネルが、macOS の言語だけでなく、アプリで選んだ言語に従うようになりました。</strong> 以前は、アプリを中国語にしていても英語の Mac では英語で表示されていました。</li>
</ul>
<h3>アップデート</h3>
<ul>
<li><strong>アップデートウィンドウに、そのバージョンの新機能が表示されるようになりました。</strong> アプリの言語（英語、中国語、日本語）で、インストールするか決める前に読めます。</li>
<li><strong>アップデート後の「新機能」も中国語と日本語で表示されます。</strong> 英語だけではなくなりました。</li>
</ul>
</body>
</html>
