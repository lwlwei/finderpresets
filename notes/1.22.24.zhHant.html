<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>修復</h3>
<ul>
<li><strong>更新視窗的按鈕（安裝更新、跳過這個版本……）和“開啟”“儲存”面板，現在跟隨你在 App 里選的語言</strong>，而不只是 macOS 的語言。以前 App 設成中文、系統是英文時，它們會顯示英文。</li>
</ul>
<h3>更新</h3>
<ul>
<li><strong>更新視窗現在會顯示這個版本的新內容</strong>，用 App 的語言（英文、中文、日文），讓你決定要不要安裝之前就能看到。</li>
<li><strong>更新後的“新功能”也有中文和日文了</strong>，不再只有英文。</li>
</ul>
</body>
</html>
