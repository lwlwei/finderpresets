<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>サイドバー</h3>
<ul>
<li><strong>空のサイドバーが、ウェルカム表示の内容に合わせた大きさになりました。</strong> 以前に引き伸ばした高さで途切れることなく、おすすめのフォルダがすべて見えます。</li>
<li><strong>自動で隠れるサイドバーが、クリックした後もまた自動で収まるようになりました。</strong> 以前は、一度クリックしたバーが開いたままになることがありました。今は、入力欄に入力している間だけ開いたままになります。</li>
</ul>
<h3>使い方のヒント</h3>
<ul>
<li>繰り返し再生されるアニメーションを毎秒 30 フレームに戻しました。より滑らかで、ウィンドウが見えない間は引き続き止まります。</li>
</ul>
</body>
</html>
