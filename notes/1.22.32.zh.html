<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>菜单栏</h3>
<ul>
<li><strong>菜单栏图标的菜单变短了。</strong> 新安装时只显示预设、管理预设、快速跳转、命令面板和侧边栏；其余命令都在“更多”里。点图标时按住 Option，可以一次看到所有命令。</li>
<li><strong>在“设置 <span class="k">▸</span> 通用 <span class="k">▸</span> 菜单栏菜单”里选择哪些留在最上层</strong>，也可以用一个按钮在“简洁菜单”和“全部放在顶层”之间切换。已经在使用的用户，菜单保持原样，直到你自己修改。</li>
<li>新增使用技巧“让菜单栏菜单保持简短”来说明这些。</li>
</ul>
<h3>速度</h3>
<ul>
<li>打开菜单栏菜单时，系统状态只检查一次，并跳过最慢的一项查询。</li>
</ul>
</body>
</html>
