<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>選單列</h3>
<ul>
<li><strong>選單列圖示的選單變短了。</strong> 新安裝時只顯示預設、管理預設、快速跳轉、命令面板和側邊欄；其餘命令都在“更多”里。點圖示時按住 Option，可以一次看到所有命令。</li>
<li><strong>在“設定 <span class="k">▸</span> 通用 <span class="k">▸</span> 選單列選單”里選擇哪些留在最上層</strong>，也可以用一個按鈕在“簡潔選單”和“全部放在頂層”之間切換。已經在使用的使用者，選單保持原樣，直到你自己修改。</li>
<li>新增使用技巧“讓選單列選單保持簡短”來說明這些。</li>
</ul>
<h3>速度</h3>
<ul>
<li>開啟選單列選單時，系統狀態只檢查一次，並跳過最慢的一項查詢。</li>
</ul>
</body>
</html>
