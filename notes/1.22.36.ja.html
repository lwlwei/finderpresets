<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>サイドバー</h3>
<ul>
<li><strong>文字を入力してフォルダを探す機能が使えるようになりました。</strong> サイドバーのタイトルを一度クリックしてキーボードを与え（フォルダをクリックしても変わらないので、そのクリックで「開く／保存」ウィンドウへ送れます）、名前や別名の一部を入力するか ↑↓ で選び、Return で開きます。</li>
<li><strong>サブリストとして表示しているカテゴリの中のフォルダも見つかります</strong>：そのリストが開いて一致した行が選ばれ、入力はリストの中で続けられます。</li>
</ul>
</body>
</html>
