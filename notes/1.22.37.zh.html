<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>侧边栏</h3>
<ul>
<li><strong>鼠标停在侧边栏上，它就会拿到键盘</strong>：输入文件夹名称或别名的一部分来定位，用 ↑↓ 移动，回车打开。不用点击，鼠标离开后键盘会还给原来的 App。</li>
<li>前面有“打开/存储”窗口时（点文件夹仍要能把那个窗口送过去）、你正在别的 App 的文本框里输入时、正在拖动时、鼠标只是路过时，它都不会拿走键盘。可以在“设置”<span class="k">▸</span>“侧边栏”里关闭。</li>
<li>点一下侧边栏的标题，仍然是主动让它拿键盘。</li>
</ul>
<h3>修复</h3>
<ul>
<li>异常退出后弹出的提示，现在 VoiceOver 能读出来。</li>
<li>开发版退出时会把已安装 App 的偏好设置还原（它们曾经留下固定的边缘和高度）。</li>
</ul>
</body>
</html>
