<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>側邊欄</h3>
<ul>
<li><strong>滑鼠停在側邊欄上，它就會拿到鍵盤</strong>：輸入資料夾名稱或別名的一部分來定位，用 ↑↓ 移動，回車開啟。不用點按，滑鼠離開後鍵盤會還給原來的 App。</li>
<li>前面有“開啟/儲存”視窗時（點資料夾仍要能把那個視窗送過去）、你正在別的 App 的文本框里輸入時、正在拖移時、滑鼠只是路過時，它都不會拿走鍵盤。可以在“設定”<span class="k">▸</span>“側邊欄”里關閉。</li>
<li>點一下側邊欄的標題，仍然是主動讓它拿鍵盤。</li>
</ul>
<h3>修復</h3>
<ul>
<li>異常結束後彈出的提示，現在 VoiceOver 能讀出來。</li>
<li>開發版結束時會把已安裝 App 的偏好設定還原（它們曾經留下固定的邊緣和高度）。</li>
</ul>
</body>
</html>
