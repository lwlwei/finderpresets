<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>設定</h3>
<ul>
<li><strong>設定が独立したウィンドウになりました。</strong> メニューバーアイコン <span class="k">▸</span> 設定…（<span class="k">⌘</span>,）、またはアプリメニューの「設定…」から開きます。プリセット一覧と並べて開いたままにでき、サイズも変えられます。アプリメニューの「プリセットを管理…」は <span class="k">⇧</span><span class="k">⌘</span>, になりました。ヒントもここを案内します。</li>
<li><strong>サイドバーの新しいオプション</strong>：隠すまでの待ち時間、キーボードを取るまでマウスを置く時間、「最近」と「Finder で開いているフォルダ」の表示数。<strong>新規</strong>：短い通知の表示時間。すべて「設定も同期」で Mac 間に引き継がれます。</li>
</ul>
</body>
</html>
