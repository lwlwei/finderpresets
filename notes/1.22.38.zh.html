<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>设置</h3>
<ul>
<li><strong>设置有了自己的窗口。</strong> 菜单栏图标 <span class="k">▸</span> 设置…（<span class="k">⌘</span>,），或应用菜单里的“设置…”；它可以和预设列表同时开着，也能调整大小。应用菜单里的“管理预设…”改成了 <span class="k">⇧</span><span class="k">⌘</span>,。使用技巧也都指向它。</li>
<li><strong>新的侧边栏选项</strong>：收起前等多久、鼠标停多久才拿键盘、“最近”和“Finder 里已打开的文件夹”列出多少个。<strong>新增</strong>：短提示在屏幕上停留多久。这些都会随“同时同步设置”在多台 Mac 间同步。</li>
</ul>
</body>
</html>
