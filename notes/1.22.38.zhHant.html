<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>設定</h3>
<ul>
<li><strong>設定有了自己的視窗。</strong> 選單列圖示 <span class="k">▸</span> 設定…（<span class="k">⌘</span>,），或應用選單里的“設定…”；它可以和預設列表同時開著，也能調整大小。應用選單里的“管理預設…”改成了 <span class="k">⇧</span><span class="k">⌘</span>,。使用技巧也都指向它。</li>
<li><strong>新的側邊欄選項</strong>：收起前等多久、滑鼠停多久才拿鍵盤、“最近”和“Finder 裡已開啟的資料夾”列出多少個。<strong>新增</strong>：短提示在螢幕上停留多久。這些都會隨“同時同步設定”在多台 Mac 間同步。</li>
</ul>
</body>
</html>
