<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>プリセットフォルダを作成</h3>
<ul>
<li><strong>既存フォルダの構成を読み取って、自分で編集できます。</strong> 「既存フォルダからテンプレートを作成…」で、選んだフォルダ、Finder で開いているフォルダ、Finder で選択中のフォルダ（新規：「Finder で選択中のフォルダを使う」）の構成が、自由に編集できるテキスト欄に表示され、編集してからテンプレートとして保存できます。行の追加・削除・名前変更、Tab で入れ子、行頭の + でファイル。複数のフォルダを選ぶと、それぞれがテンプレートのフォルダになります。</li>
<li>やり方を示す新しいヒントを追加しました。</li>
</ul>
</body>
</html>
