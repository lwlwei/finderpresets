<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>サイドバー</h3>
<ul>
<li><strong>まだ存在しないフォルダをその場で作成できます。</strong> パスがまだ作られていない動的フォルダ（今日の日付のフォルダなど）の横に「フォルダを作成」アイコンが出ます。右クリックメニューにも同じコマンドがあります。</li>
<li><strong>サブリストはマウスを置くだけで開きます。</strong> クリックは不要です。リスト表示のカテゴリ、「最近」、「開いているフォルダ」が対象です。別のリストへ移ると切り替わります。ドラッグ中は開かず、「設定 <span class="k">▸</span> サイドバー」でオフにもできます。</li>
</ul>
</body>
</html>
