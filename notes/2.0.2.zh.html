<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>侧边栏</h3>
<ul>
<li><strong>还不存在的文件夹可以直接新建。</strong>路径还没建出来的动态文件夹（比如今天日期的文件夹），旁边多了“新建文件夹”图标，右键菜单里也有同样的命令。</li>
<li><strong>鼠标停在二级菜单上就自动打开，不用点击</strong>：显示为列表的分类、“最近”和“已打开的文件夹”都是。移到另一个列表会直接切换；拖拽时不会弹出；可以在“设置 <span class="k">▸</span> 侧边栏”里关掉。</li>
</ul>
</body>
</html>
