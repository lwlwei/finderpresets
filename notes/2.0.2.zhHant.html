<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>側邊欄</h3>
<ul>
<li><strong>還不存在的資料夾可以直接新增。</strong>路徑還沒建出來的動態資料夾（比如今天日期的資料夾），旁邊多了“新增資料夾”圖示，右鍵選單里也有同樣的命令。</li>
<li><strong>滑鼠停在二級選單上就自動開啟，不用點按</strong>：顯示為列表的分類、“最近”和“已開啟的資料夾”都是。移到另一個列表會直接切換；拖拽時不會彈出；可以在“設定 <span class="k">▸</span> 側邊欄”里關掉。</li>
</ul>
</body>
</html>
