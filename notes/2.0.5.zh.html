<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>

<body>
<h3>打开文件夹</h3>
<ul>
<li><strong>你自己在 Finder 里打开的文件夹，也能用默认视图。</strong>“设置 <span class="k">▸</span> 打开预设”里新增“连我自己在 Finder 里打开的文件夹也套用”。Finder 窗口新开、或你在窗口里进入另一个文件夹时，会切换成“所有文件夹打开时显示为”里选的视图，每个文件夹只切一次。已经开着的窗口、你手动改过的视图都不会被动，预设自己设置的视图仍然优先。需要“辅助功能”权限，Finder 会给每个被切换的文件夹记住这个视图。</li>
<li>新增一条使用技巧，演示怎么做。</li>
</ul>
</body>
</html>
