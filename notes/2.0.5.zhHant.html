<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }

<body>
<h3>開啟資料夾</h3>
<ul>
<li><strong>你自己在 Finder 裡開啟的資料夾，也能用預設檢視。</strong>“設定 <span class="k">▸</span> 開啟預設”里新增“連我自己在 Finder 裡開啟的資料夾也套用”。Finder 視窗新開、或你在視窗裡進入另一個資料夾時，會切換成“所有資料夾開啟時顯示為”里選的檢視，每個資料夾只切一次。已經開著的視窗、你手動改過的檢視都不會被動，預設自己設定的檢視仍然優先。需要“輔助使用”權限，Finder 會給每個被切換的資料夾記住這個檢視。</li>
<li>新增一條使用技巧，演示怎麼做。</li>
</ul>
</body>
</html>
