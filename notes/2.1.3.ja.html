<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>ヒント</h3>
<ul>
<li><strong>アニメーション付きのヒントを 4 つ追加：</strong>名前に角括弧があるフォルダはそのまま開く、「開く内容をプレビュー…」と「今すぐ開く」で開く前に確認する、プリセット一覧の右クリックメニュー・Delete キー・<span class="k">⌘</span>Z で削除したプリセットを戻す、「サービス」メニューの「プリセットに追加」が追加した内容を知らせる。</li>
</ul>
</body>
</html>
