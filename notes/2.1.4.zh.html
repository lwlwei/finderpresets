<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>更好用</h3>
<ul>
<li><strong>繁体中文读起来更自然：</strong>补充了更多台湾用词（尋找、回應、載入、當機、文字、介面、佈局）。</li>
<li><strong>“服务”技巧里的按钮改为打开管理预设，</strong>那里才能使用“加入预设”，不再跳到 Finder 扩展设置；帮助页也补充了带方括号文件夹的说明。</li>
</ul>
<h3>更稳定</h3>
<ul>
<li><strong>名称带方括号的真实文件夹在侧边栏里能正常使用。</strong>“[date] Reports”不再变成今天的日期，“[Client] Project”也不再要你填名称，而是作为文件夹原样打开；之前加入的行也能重新找到文件夹；手动输入路径时仍然是模板。</li>
</ul>
</body>
</html>
