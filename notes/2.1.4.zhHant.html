<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>更好用</h3>
<ul>
<li><strong>繁體中文讀起來更自然：</strong>補充了更多台灣用詞（尋找、回應、載入、當機、文字、介面、佈局）。</li>
<li><strong>“服務”技巧裡的按鈕改為開啟管理預設組，</strong>那裡才能使用“加入預設組”，不再跳到 Finder 延伸功能設定；幫助頁也補充了帶方括號資料夾的說明。</li>
</ul>
<h3>更穩定</h3>
<ul>
<li><strong>名稱帶方括號的真實資料夾在側邊欄裡能正常使用。</strong>“[date] Reports”不再變成今天的日期，“[Client] Project”也不再要你填名稱，而是作為資料夾原樣開啟；之前加入的行也能重新找到資料夾；手動輸入路徑時仍然是範本。</li>
</ul>
</body>
</html>
