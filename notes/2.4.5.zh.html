<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>修复</h3>
<ul>
<li><strong>选定文件夹后不再重复询问“选哪个文件夹”。</strong> 预设打开前要填值时，如果你从输入框下面的列表里选了一个文件夹（或直接回车用排在最前面的那个），FinderPresets 不会再为预设里的其他路径重复问一遍。在命令面板里选定文件夹也一样。</li>
</ul>
<h3>“更多功能”里的新功能（直接下载版）</h3>
<ul>
<li><strong>在侧边栏里打开剪贴板里的路径。</strong> “在侧边栏里打开剪贴板里的路径”会在侧边栏的“+”菜单里加一项“打开剪贴板里的路径”：路径指向文件夹就在 Finder 中打开，指向文件就打开它所在的位置并选中该文件。在 Finder 里拷贝的文件也可以，只有你点这一项时才会读取剪贴板。</li>
</ul>
</body>
</html>
