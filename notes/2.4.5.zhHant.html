<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; margin: 12px 16px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #3b82f6; text-transform: none; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 3px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127,127,127,.18); border-radius: 4px; padding: 1px 4px; }
  a { color: #3b82f6; }
  .k { font-family: "Apple Symbols", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<h3>修復</h3>
<ul>
<li><strong>選定資料夾後不再重複詢問“選哪個資料夾”。</strong> 預設組開啟前要填值時，如果你從輸入框下面的列表裡選了一個資料夾（或直接回車用排在最前面的那個），FinderPresets 不會再為預設組裡的其他路徑重複問一遍。在命令面板裡選定資料夾也一樣。</li>
</ul>
<h3>“更多功能”裡的新功能（直接下載版）</h3>
<ul>
<li><strong>在側邊欄裡開啟剪貼板裡的路徑。</strong> “在側邊欄裡開啟剪貼板裡的路徑”會在側邊欄的“+”選單裡加一項“開啟剪貼板裡的路徑”：路徑指向資料夾就在 Finder 中開啟，指向檔案就開啟它所在的位置並選取該檔案。在 Finder 裡拷貝的檔案也可以，只有你點這一項時才會讀取剪貼板。</li>
</ul>
</body>
</html>
